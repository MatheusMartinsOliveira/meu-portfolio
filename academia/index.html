<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Movimente-se</title>
</head>
<body>
    <main>
        <section>
            <h3>Academia Movimente-se</h3>
            <form action="#" method="post">
                <fieldset>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required minlength="3"><br><br>
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" required pattern="[0-9]{11}" placeholder="Somente números" title="Ex.: 12345678901"><br><br>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required><br><br>
                    <label for="data_nascimento">Data de Nascimento:</label>
                    <input type="date" id="data_nascimento" name="data_nascimento"><br><br>
                    <label for="peso">Peso (kg):</label>
                    <input type="number" id="peso" name="peso" step="0.1" min="0"><br><br>
                    <label for="plano">Plano:</label>
                    <input type="radio" for="plano" id="mensal" name="plano" value="mensal">
                    <label for="mensal">Mensal</label>
                    <input type="radio" for="plano" id="trimestral" name="plano" value="trimestral">
                    <label for="trimestral">Trimestral</label>
                    <input type="radio" for="plano" id="anual" name="plano" value="anual">
                    <label for="anual">Anual</label><br><br>
                    <label for="horario_preferido">Horário preferido:</label>
                    <input type="time" id="horario_preferido" name="horario_preferido" min="06:00" max="22:00"><br><br>
                    <input type="checkbox" id="musculacao">
                    <label for="musculacao">Musculação</label><br>
                    <input type="checkbox" id="pilates">
                    <label for="pilates">Pilates</label><br>
                    <input type="checkbox" id="spinning">
                    <label for="spinning">Spinning</label><br>
                    <input type="checkbox" id="natacao">
                    <label for="natacao">Natação</label><br><br>
                    <button type="submit">Enviar</button>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
